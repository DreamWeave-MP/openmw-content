manifest_version = 1

[package]
id = "org.dreamweave.openmw-content"
version = "0.1.0"
jess_api = "1"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.esm" = "0.1"

# The suite hands the package a real Context; the package itself only names its shape.
[dev-dependencies]
"org.dreamweave.openmw-install" = "0.1"

[modules]
"@openmw-content" = "src/init.jsl"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. Opening a load order reads its content files.

[[layer]]
id = "openmw-content.core"
requires = ["esm.core"]
exports = ["@openmw-content"]
